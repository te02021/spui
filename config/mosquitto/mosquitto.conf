# ============================================================================
# SPUI — Configuración del broker Mosquitto
# ============================================================================
#
# Este archivo es la fuente de verdad. El que vive en el directorio de
# instalación de Mosquitto es una COPIA: se pierde cada vez que se reinstala
# el broker (ya pasó dos veces — ver docs/08_pendientes_vm.md). Ante cualquier
# reinstalación, volver a copiar este archivo en vez de reescribirlo de memoria.
#
# Instalación y puesta en marcha: ver README.md en este mismo directorio.
#
# Estado: tarea 1.0.d — TLS del broker escrito, NO desplegado todavía.
#   El puerto 1883 sigue escuchando en todas las interfaces a propósito: se
#   cierra a localhost recién en la tarea 1.0.f, cuando los reproductores ya
#   entren por 8883 con TLS y esté confirmado que funciona. Cerrarlo antes
#   los dejaría sin MQTT durante toda la construcción (seguirían andando por
#   HTTP, pero sin alertas ni LWT).
#
#   Antes de copiar este archivo al broker real: correr
#   generar-certificados.ps1 (si no se corrió ya) y copiar certs/ca.crt,
#   certs/server.crt y certs/server.key a la ruta que indican cafile/
#   certfile/keyfile más abajo — ajustar esas tres líneas si Mosquitto vive
#   en otro lado. Sin los certificados en esa ruta, el broker no arranca.
# ============================================================================

# ── Listener sin cifrar ─────────────────────────────────────────────────────
# TODO(1.0.f): cambiar a `listener 1883 127.0.0.1` una vez que 8883 esté
# confirmado funcionando con clientes reales (Pi + CMS).
listener 1883 0.0.0.0

# ── Listener TLS (tarea 1.0.d) ──────────────────────────────────────────────
# Mismo puerto que documenta la tesis (8883, el estándar MQTT-over-TLS). Los
# reproductores se van migrando acá; 1883 queda como red de seguridad hasta
# la 1.0.f. Certificado propio (tarea 1.0.c) — CN por hostname, no por IP,
# para no tener que reemitir si la IP del host cambia por DHCP.
listener 8883 0.0.0.0
cafile   D:\Program Files\Mosquitto\certs\ca.crt
certfile D:\Program Files\Mosquitto\certs\server.crt
keyfile  D:\Program Files\Mosquitto\certs\server.key
# require_certificate false: los CLIENTES (Pi y CMS) validan el certificado
# del broker, pero el broker no les exige uno a ellos — la autenticación de
# cliente sigue siendo usuario/contraseña vía Dynamic Security (tarea 1.0.a),
# no mTLS. Agregar mTLS es una vuelta de tuerca más que no está en el alcance
# acordado (ver plan de comunicación, "las tres capas: auth + ACL + TLS").
require_certificate false

# Nadie entra sin credenciales. Es lo que impide que cualquiera en la red del
# campus publique en spui/alertas/emergencia y dispare una alerta en todas las
# pantallas.
allow_anonymous false

# ── Autenticación y ACLs: plugin Dynamic Security ───────────────────────────
# Los usuarios y permisos no viven en archivos de texto sino en un JSON que
# administra el propio broker, y se modifican publicando en el topic
# $CONTROL/dynamic-security/v1.
#
# Por qué así y no password_file/acl_file: dar de alta un reproductor desde el
# CMS requeriría que PHP ejecutara mosquitto_passwd.exe DENTRO del directorio
# de instalación y reiniciara el servicio. Ese directorio necesita permisos de
# administrador (verificado: una shell normal no puede ni escribir un backup
# ahí), así que en la VM fallaría. Con Dynamic Security el CMS sólo publica un
# mensaje MQTT: no toca el disco ni reinicia nada.
#
# OJO con las rutas en este archivo: Mosquitto NO interpreta comillas, se las
# traga como parte del valor. Escribirlas produce el error engañoso
# `Unable to load plugin "  "D:\...dll""` — que parece un problema de permisos
# o de la DLL, cuando en realidad la ruta llegó entrecomillada. Van sin comillas
# aunque tengan espacios.
#
# Si Mosquitto está instalado en otra ruta, ajustar SOLO estas dos líneas.
plugin D:\Program Files\Mosquitto\mosquitto_dynamic_security.dll
plugin_opt_config_file D:\Program Files\Mosquitto\dynamic-security.json

# ── Persistencia ────────────────────────────────────────────────────────────
# Sin esto, un reinicio del broker pierde los mensajes retenidos — entre ellos
# la alerta de emergencia vigente, que es justo lo que un reproductor necesita
# recibir al reconectarse.
#
# La barra final es obligatoria: Mosquitto concatena el nombre del archivo
# directamente, sin agregar separador.
#
# Va en ProgramData y no en Program Files a propósito: ese directorio necesita
# permisos de administrador para escribir, así que el servicio fallaría al
# arrancar con una cuenta restringida. ProgramData es el lugar que Windows
# define para datos de aplicación escribibles.
persistence true
persistence_location C:\ProgramData\mosquitto\

# ── Logging ─────────────────────────────────────────────────────────────────
# Los intentos de conexión rechazados quedan registrados acá: es donde mirar
# si un reproductor deja de recibir alertas.
log_dest file C:\ProgramData\mosquitto\mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# ── Límites ─────────────────────────────────────────────────────────────────
# Los payloads de SPUI son diminutos (alertas y comandos, cientos de bytes).
# 64 KB deja margen de sobra y acota el daño de un cliente que se comporte mal.
# (En 2.x se llama max_packet_size; message_size_limit quedó deprecado.)
max_packet_size 65536
