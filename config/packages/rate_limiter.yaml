framework:
    rate_limiter:
        # Reproductor → sync: máx 4 por minuto. El sync periódico usa uno (cada
        # 1 a 5 min, según el reproductor) y el resto queda para los avisos del
        # CMS (sync_ahora) al guardar un cambio. Con 2 (hasta el 24/10/2026),
        # guardar la playlist y después la pantalla en el mismo minuto ya
        # recibía 429 y el cambio tardaba en verse.
        spui_reproductor_sync:
            policy: sliding_window
            limit: 4
            interval: '1 minute'
            cache_pool: cache.app

        # Reproductor → heartbeat: máx 3 por minuto (el Pi envía cada 60s)
        spui_reproductor_heartbeat:
            policy: sliding_window
            limit: 3
            interval: '1 minute'
            cache_pool: cache.app

        # Reproductor → telemetría: máx 3 por minuto (el Pi envía cada 60s, igual
        # que heartbeat). Antes no tenía ningún límite propio ni caía en spui_api
        # (esa política nunca se cableó a ningún controller) — una key filtrada o
        # un Pi con un bug podía insertar filas sin tope.
        spui_reproductor_telemetria:
            policy: sliding_window
            limit: 3
            interval: '1 minute'
            cache_pool: cache.app

        # Admin API general: 120 req/min por IP
        spui_api:
            policy: sliding_window
            limit: 120
            interval: '1 minute'
            cache_pool: cache.app
